s (Note 1))","1\/2 cup plain yoghurt, ( full fat best (Greek is fine))","6 cloves garlic (, minced (~1.5 tbsp))","1 tbsp fresh ginger (, grated)","1 tsp garam masala ((Note 2))","1 tsp each salt, cumin, ground coriander, paprika (sweet, normal or smokey)","1 tbsp vegetable oil","1\/8 tsp cayenne pepper ((optional))","Pinch black pepper","2 tsp lemon juice","1 - 2 tbsp oil ((Note 3))","2 tsp turmeric","1 tbsp garam masala ((Note 2))","2 tsp coriander","1 tsp cumin","1\/8 tsp cardamom powder","1\/8 tsp cayenne pepper","3 tbsp (65ml)  vegetable oil ((Note 3))","30g \/ 2 tbsp  unsalted butter OR ghee","1  onion, finely chopped ((brown, white or yellow))","1 tsp salt","2 tbsp fresh ginger (, grated)","6 cloves garlic (, crushed or grated)","1 tbsp paprika ((not smoked))","1 2\/3 cups (400ml)  tomato passata ((tomato puree))","1 2\/3 cups (400ml)  water","100 ml (1\/3 cup + 1 tbsp)  cream ((thickened or pure is fine))","1 tsp sugar","50g \/ 3 tbsp   unsalted butter OR ghee","Basmati rice"],"recipeInstructions":[{"@type":"HowToSection","name":"Chicken Tikka:","itemListElement":[{"@type":"HowToStep","text":"Combine all ingredients except chicken in a bowl and mix. Add chicken and turn well to coat.","name":"Combine all ingredients except chicken in a bowl and mix. Add chicken and turn well to coat.","url":"https:\/\/www.recipetineats.com\/chicken-tikka-masala\/#wprm-recipe-28202-step-0-0"},{"@type":"HowToStep","text":"Cover with cling wrap and leave in fridge to marinate overnight (3 hours minimum).","name":"Cover with cling wrap and leave in fridge to marinate overnight (3 hours minimum).","url":"https:\/\/www.recipetineats.com\/chicken-tikka-masala\/#wprm-recipe-28202-step-0-1"},{"@type":"HowToStep","text":"Heat 1 tbsp oil in a non stick pan over high heat until smoking. Add half the chicken and spread out. Leave for 2 minutes or until charred. Turn each piece and cook the other side until charred - don't worry if not cooked inside. (Note 4, also Video helpful here) Remove into bowl.","name":"Heat 1 tbsp oil in a non stick pan over high heat until smoking. Add half the chicken and spread out. Leave for 2 minutes or until charred. Turn each piece and cook the other side until charred - don't worry if not cooked inside. (Note 4, also Video helpful here) Remove into bowl.","url":"https:\/\/www.recipetineats.com\/chicken-tikka-masala\/#wprm-recipe-28202-step-0-2"},{"@type":"HowToStep","text":"Scrape out charred bits left in pan and discard. Add more oil if required and cook remaining chicken.","name":"Scrape out charred bits left in pan and discard. Add more oil if required and cook remaining chicken.","url":"https:\/\/www.recipetineats.com\/chicken-tikka-masala\/#wprm-recipe-28202-step-0-3"}]},{"@type":"HowToSection","name":"Sauce:","itemListElement":[{"@type":"HowToStep","text":"Wipe skillet with paper towels (or do this part in a pot as you need a lid). Turn heat down to medium high.","name":"Wipe skillet with paper towels (or do this part in a pot as you need a lid). Turn heat down to medium high.","url":"https:\/\/www.recipetineats.com\/chicken-tikka-masala\/#wprm-recipe-28202-step-1-0"},{"@type":"HowToStep","text":"Add oil and butter. When butter is melted, add onions, ginger and salt.","name":"Add oil and butter. When butter is melted, add onions, ginger and salt.","url":"https:\/\/www.recipetineats.com\/chicken-tikka-masala\/#wprm-recipe-28202-step-1-1"},{"@type":"HowToStep","text":"Cook, stirring constantly to ensure it doesn't burn, until the ginger is starting to turn golden and the onions smell sweet, about 5 - 7 minutes.","name":"Cook, stirring constantly to ensure it doesn't burn, until the ginger is starting to turn golden and the onions smell sweet, about 5 - 7 minutes.","url":"https:\/\/www.recipetineats.com\/chicken-tikka-masala\/#wprm-recipe-28202-step-1-2"},{"@type":"HowToStep","text":"Reduce the heat to medium. Add the garlic and paprika, and cook for 2 minutes.","name":"Reduce the heat to medium. Add the garlic and paprika, and cook for 2 minutes.","url":"https:\/\/www.recipetineats.com\/chicken-tikka-masala\/#wprm-recipe-28202-step-1-3"},{"@type":"HowToStep","text":"Add the Curry Sauce Spices, and cook a further 2 minutes, stirring.","name":"Add the Curry Sauce Spices, and cook a further 2 minutes, stirring.","url":"https:\/\/www.recipetineats.com\/chicken-tikka-masala\/#wprm-recipe-28202-step-1-4"},{"@type":"HowToStep","text":"Add tomato passata and water, and mix. Bring to a simmer, then cover and reduce heat to low.","name":"Add tomato passata and water, and mix. Bring to a simmer, then cover and reduce heat to low.","url":"https:\/\/www.recipetineats.com\/chicken-tikka-masala\/#wprm-recipe-28202-step-1-5"},{"@type":"HowToStep","text":"Simmer for 15 minutes, stirring occasionally.","name":"Simmer for 15 minutes, stirring occasionally.","url":"https:\/\/www.recipetineats.com\/chicken-tikka-masala\/#wprm-recipe-28202-step-1-6"},{"@type":"HowToStep","text":"Pour curry into a bowl, then use a stick blender to puree until smooth (Note 5).","name":"Pour curry into a bowl, then use a stick blender to puree until smooth (Note 5).","url":"https:\/\/www.recipetineats.com\/chicken-tikka-masala\/#wprm-recipe-28202-step-1-7"},{"@type":"HowToStep","text":"Return sauce to skillet. Add cream, sugar and butter. Stir to melt the butter.","name":"Return sauce to skillet. Add cream, sugar and butter. Stir to melt the butter.","url":"https:\/\/www.recipetineats.com\/chicken-tikka-masala\/#wprm-recipe-28202-step-1-8"},{"@type":"HowToStep","text":"Add chicken, stir. Simmer for a few minutes until the chicken is cooked through.","name":"Add chicken, stir. Simmer for a few minutes until the chicken is cooked through.","url":"https:\/\/www.recipetineats.com\/chicken-tikka-masala\/#wprm-recipe-28202-step-1-9"},{"@type":"HowToStep","text":"Optional: Sprinkle with a pinch of extra garam masala at the end.","name":"Optional: Sprinkle with a pinch of extra garam masala at the end.","url":"https:\/\/www.recipetineats.com\/chicken-tikka-masala\/#wprm-recipe-28202-step-1-10"},{"@type":"HowToStep","text":"Serve over basmati rice, sprinkled with coriander\/cilantro if desired. Try this No Yeast Flatbread as a quick naan!","name":"Serve over basmati rice, sprinkled with coriander\/cilantro if desired. Try this No Yeast Flatbread as a quick naan!","url":"https:\/\/www.recipetineats.com\/chicken-tikka-masala\/#wprm-recipe-28202-step-1-11"}]}],"aggregateRating":{"@type":"AggregateRating","ratingValue":"4.97","ratingCount":"238","reviewCount":"13"},"review":[{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Thank you Nagi this recipe was delicious! The whole family loved it and thought it was better than take out! Will definitely be making this a regular dish!","author":{"@type":"Person","name":"Ling"},"datePublished":"2026-09-07"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"This recipe is incredible, I made it for my work colleague, whose favourite meal is Tikka Masala, and he said it was the best he’s ever had.\r\n\r\nI’m a vegetarian myself and would absolutely love to make a vegetable version. I’m just a little stuck on how I could adapt the marinated part of the recipe for vegetables. Any suggestions would be really appreciated.","author":{"@type":"Person","name":"Tanyia Taylor"},"datePublished":"2026-09-07"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"This was delicious, thank You Nagi. Thé spices were just right and I’m already looking forward to making it again.","author":{"@type":"Person","name":"Jane"},"datePublished":"2026-08-28"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"I feel the same exact way (I love Nagi so much, no complaints at all..She's my favorite!!) This was quite tomatoey. I added some more heavy cream and I'm letting it rest until tomorrow night. Made Nagi's amazing naan bread to go with it, whi
