":"PropertyValueSpecification","valueRequired":true,"valueName":"search_term_string"}}],"inLanguage":"en-US"},{"@type":["Person","Organization"],"@id":"https:\/\/pinchofyum.com\/#\/schema\/person\/8d4b17c71f73debc14204a0352749dca","name":"Lindsay Ostrom","image":{"@type":"ImageObject","inLanguage":"en-US","@id":"https:\/\/pinchofyum.com\/tachyon\/Headshot-Main-Bio-Circle.jpg","url":"https:\/\/pinchofyum.com\/tachyon\/Headshot-Main-Bio-Circle.jpg","contentUrl":"https:\/\/pinchofyum.com\/tachyon\/Headshot-Main-Bio-Circle.jpg","width":1638,"height":1638,"caption":"Lindsay"},"logo":{"@id":"https:\/\/pinchofyum.com\/tachyon\/Headshot-Main-Bio-Circle.jpg"},"description":"A little thing about me: I ♡ FOOD. I used to be a teacher, and now making food and writing about it online is my full-time job. I love talking with people about food, and I'm so glad you're here. Did you make a recipe? Tag @pinchofyum on Instagram so we can find you!","sameAs":["https:\/\/pinchofyum.com","https:\/\/www.facebook.com\/pinchofyum","https:\/\/instagram.com\/pinchofyum","https:\/\/pinterest.com\/pinchofyum","https:\/\/x.com\/pinchofyum"],"url":"https:\/\/pinchofyum.com\/author\/lindsay"},{"@type":"Question","@id":"https:\/\/pinchofyum.com\/the-best-soft-chocolate-chip-cookies#faq-question-1602617563887","position":1,"url":"https:\/\/pinchofyum.com\/the-best-soft-chocolate-chip-cookies#faq-question-1602617563887","name":"Why did my cookies flatten?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"The three most important things about this recipe are 1) Melting the butter, 2) Adding enough flour, and 3) Not baking for too long. If you find that the dough is wet and it REALLY sticks to your hands, you probably need more flour. I'll usually add a few tablespoons at a time to get it to the right consistency. See the video in this post for reference as well as the cookie chart below!","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Question","@id":"https:\/\/pinchofyum.com\/the-best-soft-chocolate-chip-cookies#faq-question-1602617770440","position":2,"url":"https:\/\/pinchofyum.com\/the-best-soft-chocolate-chip-cookies#faq-question-1602617770440","name":"Why are my cookies so puffy?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"This usually means that there's too much flour in the dough, keeping them from spreading more. Be sure to always measure your flour correctly (spooning it in to the measuring cup vs. scooping from the bag). Since you can always add more, it's important to not over-flour to start with. See the video in this post for reference on the correct consistency!","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Question","@id":"https:\/\/pinchofyum.com\/the-best-soft-chocolate-chip-cookies#faq-question-1602617912183","position":3,"url":"https:\/\/pinchofyum.com\/the-best-soft-chocolate-chip-cookies#faq-question-1602617912183","name":"Can I freeze chocolate chip cookie dough?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"Yes! Roll them up into balls, freeze them on a sheet pan, and then keep them in a bag in the freezer until ready to bake. We'd recommend letting them thaw on a sheet pan (covered) before baking.","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Question","@id":"https:\/\/pinchofyum.com\/the-best-soft-chocolate-chip-cookies#faq-question-1602618026113","position":4,"url":"https:\/\/pinchofyum.com\/the-best-soft-chocolate-chip-cookies#faq-question-1602618026113","name":"Can I make these gluten-free?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"We've never tried it with this recipe, but I'm sure you could! If you have a favorite 1:1 gluten-free flour, that's probably your best bet. We'd love to hear how it goes.","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Question","@id":"https:\/\/pinchofyum.com\/the-best-soft-chocolate-chip-cookies#faq-question-1602618348261","position":5,"url":"https:\/\/pinchofyum.com\/the-best-soft-chocolate-chip-cookies#faq-question-1602618348261","name":"How should I store the cookies after baking?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"The cookies can be kept in an airtight container at room temperature for 3-4 days, or in the fridge for a week. We like the fridge method to keep them fresh! <a href=\"https:\/\/geni.us\/2BWJ7BA\" target=\"_blank\" rel=\"noreferrer noopener sponsored nofollow\">These<\/a> are our personal favorite glass storage containers!*","inLanguage":"en-US"},"inLanguage":"en-US"},{"@type":"Question","@id":"https:\/\/pinchofyum.com\/the-best-soft-chocolate-chip-cookies#faq-question-1657747941358","position":6,"url":"https:\/\/pinchofyum.com\/the-best-soft-chocolate-chip-cookies#faq-question-1657747941358","name":"Does this recipe work for high-altitude baking?","answerCount":1,"acceptedAnswer":{"@type":"Answer","text":"Yes! Remember that when baking at a high altitude some baked goods will leaven and flatten more quickly. If you're baking at 3,000+ ft elevation, we recommend increasing your oven temp to 375 degrees and reducing bake time by a few minutes. For more information on high-altitude baking, we love u003ca href=u0022https:\/\/www.kingarthurbaking.com\/learn\/resources\/high-altitude-bakingu0022 target=u0022_blanku0022 rel=u0022noreferrer noopener nofollowu0022u003ethisu003c\/au003e resource.","inLanguage":"en-US"},"inLanguage":"en-US"},{"@context":"https:\/\/schema.org\/","@type":"Recipe","name":"The Best Soft Chocolate Chip Cookies","description":"These are THE BEST soft chocolate chip cookies! No chilling required. Just ultra thick, soft, classic chocolate chip cookies!","author":{"@type":"Person","name":"Lindsay Ostrom","url":"https:\/\/pinchofyum.com\/author\/lindsay"},"keywords":"chocolate chip cookies, best chocolate chip cookies, soft chocolate chip cookies, easy cookie recipe, small batch cookies","image":["https:\/\/pinchofyum.com\/tachyon\/Chocolate-Chip-Cookies-Recipe.jpg?fit=225%2C225","https:\/\/pinchofyum.com\/tachyon\/Chocolate-Chip-Cookies-Recipe.jpg?fit=195%2C195","https:\/\/pinchofyum.com\/tachyon\/Chocolate-Chip-Cookies-Recipe.jpg?fit=180%2C180","https:\/\/pinchofyum.com\/tachyon\/Chocolate-Chip-Cookies-Recipe.jpg"],"url":"https:\/\/pinchofyum.com\/the-best-soft-chocolate-chip-cookies","recipeIngredient":["8 tablespoons of salted butter","1\/2 cup white sugar (I like to use raw cane sugar with a coarser texture)","1\/4 cup packed light brown sugar","1 teaspoon vanilla","1 egg","1 1\/2 cups all purpose flour (6.75 ounces)","1\/2 teaspoon baking soda","1\/4 teaspoon salt (but I always add a little extra)","3\/4 cup chocolate chips (I use a combination of chocolate chips and chocolate chunks)"],"recipeInstructions":[{"@type":"HowToStep","text":"Preheat the oven to 350 degrees. Microwave the butter for about 40 seconds to just barely melt it. It shouldn&#8217;t be hot &#8211; but it should be almost entirely in liquid form.","url":"https:\/\/pinchofyum.com\/the-best-soft-chocolate-chip-cookies#instruction-step-1","video":{"@context":"http:\/\/schema.org","@type":"VideoObject","name":"Chocolate Chip Cookies Step 1","description":"Microwave the butter for about 40 seconds to just barely melt it. It shouldn't be hot - but it should be almost entirely in liquid form.","duration":"PT6S","embedUrl":"https:\/\/player.vimeo.com\/video\/415271234?dnt=1&amp;app_id=122963","contentUrl":"https:\/\/vimeo.com\/415271234","thumbnailUrl":["https:\/\/i.vimeocdn.com\/video\/888678024-a7c7e9194db31f27cb6212d51699fd315d23dbc58a99633503717c7c559c7e7f-d_295x166?region=us"],"uploadDate":"2020-05-05T15:49:20+00:00"}},{"@type":"HowToStep","text":"Using a stand mixer or electric beaters, beat the butter with the sugars until creamy. Add the vanilla and the egg; beat on low speed until just incorporated &#8211; 10-15 seconds or so (if you beat the egg for too long, the cookies will be stiff).","url":"https:\/\/pinchofyum.com\/the-best-soft-chocolate-chip-cookies#instruction-step-2","video":{"@context":"http:\/\/schema.org","@type":"VideoObject","name":"Chocolate Chip Cookies Step 2","description":"Using a stand mixer or electric beaters, beat the butter with the sugars until creamy. Add the vanilla and the egg; beat on low speed until just incorporated - 10-15 seconds or so (if you beat the egg for too long, the cookies will be stiff).","duration":"PT15S","embedUrl":"https:\/\/player.vimeo.com\/video\/415271313?dnt=1&amp;app_id=122963","contentUrl":"https:\/\/vimeo.com\/415271313","thumbnailUrl":["https:\/\/i.vimeocdn.com\/video\/888677948-94e407c46a64d950cab538b83e07fcda797c3eaae48ad95466eec068d72609cc-d_295x166?region=us"],"uploadDate":"2020-05-05T15:49:34+00:00"}},{"@type":"HowToStep","text":"Add the flour, baking soda, and salt. Mix until crumbles form. Use your hands to press the crumbles together into a dough. It should form one large ball that is easy to handle (right at the stage between &#8220;wet&#8221; dough and &#8220;dry&#8221; dough). Add the chocolate chips and incorporate with your hands.","url":"https:\/\/pinchofyum.com\/the-best-soft-chocolate-chip-cookies#instruction-step-3","video":{"@context":"http:\/\/schema.org","@type":"VideoObject","name":"Chocolate Chip Cookies Step 3","description":"Add the flour, baking soda, and salt. Mix until crumbles form. Use your hands to press the crumbles together into a dough. It should form one large ball that is easy to handle (right at the stage between \"wet\" dough and \"dry\" dough). Add the chocolate chips and incorporate with your hands.","duration":"PT19S","embedUrl":"https:\/\/player.vimeo.com\/video\/415271543?dnt=1&amp;app_id=122963","contentUrl":"https:\/\/vimeo.com\/415271543","thumbnailUrl":["https:\/\/i.vimeocdn.com\/video\/888678299-395064e7d521a2b0271c50dfb99ff8e37bb31eebe27944f23e549571f9143fa6-d_295x166?region=us"],"uploadDate":"2020-05-05T15:50:11+00:00"}},{"@type":"HowToStep","text":"Roll the dough into 12 large balls (or 9 for HUGELY awesome cookies) and place on a cookie sheet. Bake for 9-11 minutes until the cookies look puffy and dry and just barely golden. Warning, friends: DO NOT OVERBAKE. This advice is probably written on every cookie recipe everywhere, but this is essential for keeping the cookies soft. Take them out even if they look like they&#8217;re not done yet (see picture in the post). They&#8217;ll be pale and puffy.","url":"https:\/\/pinchofyum.com\/the-best-soft-chocolate-chip-cookies#instruction-step-4","video":{"@context":"http:\/\/schema.org","@type":"VideoObject","name":"Chocolate Chip Cookies Step 4","description":"Roll the dough into 12 large balls (or 9 for HUGELY awesome cookies) and place on a cookie sheet. Bake for 9-11 minutes until the cookies look puffy and dry and just barely golden.","duration":"PT16S","embedUrl":"https:\/\/player.vimeo.com\/video\/415271779?dnt=1&amp;app_id=122963","contentUrl":"https:\/\/vimeo.com\/415271779","thumbnailUrl":["https:\/\/i.vimeocdn.com\/video\/888678627-ab5a82a46c557def9d487aef1b9f358d7fcb88034fedd0553047fc017868ce0c-d_295x166?region=us"],"uploadDate":"2020-05-05T15:50:54+00:00"}},{"@type":"HowToStep","text":"Let them cool on the pan for a good 30 minutes or so (I mean, okay, eat four or five but then let the rest of them cool). They will sink down and turn into these dense, buttery, soft cookies that are the best in all the land. These should stay soft for many days if kept in an airtight container. I also like to freeze them.","url":"https:\/\/pinchofyum.com\/the-best-soft-chocolate-chip-cookies#instruction-step-5","video":{"@context":"http:\/\/schema.org","@type":"VideoObject","name":"Chocolate Chip Cookies Step 5","description":"Let them cool on the pan for a good 30 minutes or so (I mean, okay, eat four or five but then let the rest of them cool). They will sink down and turn into these dense, buttery, soft cookies that are the best in all the land.","duration":"PT8S","embedUrl":"https:\/\/player.vimeo.com\/video\/415271957?dnt=1&amp;app_id=122963","contentUrl":"https:\/\/vimeo.com\/41527195
