      id="rc-fonts"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..800;1,9..144,500..800&family=Plus+Jakarta+Sans:wght@400..800&display=swap"
    />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* Dark like the home page until the app paints, so slow networks never show a white page. */
      html,
      body {
        height: 100%;
        background: #0C0D0B;
      }
      /* Other routes are cream: set before first paint so a refresh there doesn't flash dark either. */
      html.rc-light,
      html.rc-light body {
        background: #FBF7F0;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      try {
        if (location.pathname !== '/' && location.pathname !== '/index.html') document.documentElement.className = 'rc-light';
      } catch (e) {}
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
